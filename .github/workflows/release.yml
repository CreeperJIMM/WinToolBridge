name: Build and Release WinToolBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            output_name: WinToolBridge.exe
          - rid: win-arm64
            output_name: WinToolBridge_arm64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build and Publish (${{ matrix.rid }})
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} -o ./publish

      - name: Rename EXE
        shell: pwsh
        run: |
          $exeFile = Get-ChildItem -Path ./publish -Filter *.exe | Select-Object -First 1
          Move-Item -Path $exeFile.FullName -Destination "./${{ matrix.output_name }}"

      - name: Temporarily upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ./${{ matrix.output_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts
          merge-multiple: true

      - name: Generate Release Notes
        shell: bash
        run: |
          python3 - << 'EOF'
          import os, re, subprocess

          tag = os.environ.get("GITHUB_REF_NAME", "")
          version = tag.lstrip("v")

          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
                  stderr=subprocess.DEVNULL,
                  text=True
              ).strip()
          except Exception:
              prev_tag = "initial"

          changelog_content = "### What's New\n\n- Maintenance update and performance improvements."
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              pattern = rf"(?s)## \[{re.escape(version)}\].*?(?=(## \[|$))"
              match = re.search(pattern, content)
              if match:
                  lines = match.group(0).strip().splitlines()
                  if len(lines) > 1:
                      changelog_content = "\n".join(lines[1:]).strip()

          template_path = ".github/release_template.md"
          if os.path.exists(template_path):
              with open(template_path, "r", encoding="utf-8") as f:
                  template = f.read()
              final_notes = (
                  template.replace("{{CHANGELOG_CONTENT}}", changelog_content)
                          .replace("{{CURRENT_TAG}}", tag)
                          .replace("{{PREV_TAG}}", prev_tag)
              )
          else:
              final_notes = changelog_content

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(final_notes)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-artifacts/*.exe
          body_path: ./RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}